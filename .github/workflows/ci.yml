# 主分支持续集成（2026-10-12 P1-A）：push/PR 即跑与 release 门禁同源的构建+测试+冒烟
# 背景：此前 CI 仅 tag 触发——发版前的所有 commit 无任何 CI 覆盖，测试/构建只在打 tag 时才验证。
# 门禁与 release.yml 完全同源（快照拉取 → build → 语法 → 单测 → 冒烟），另加 lib 漂移警告（不阻断 WIP 推送，
# tag 时由 release.yml 硬门禁兜底）。快照拉取复用 scripts/refresh-factory-snapshot.cjs（与客户端
# SNAPSHOT_URLS 单一来源，勿在 workflow 内再写内联候选清单）。
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 同分支新推送取消旧 run，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # 出厂快照原料出库（2026-10-12 方案 A）后构建必需：从 hub 拉取（校验不过即失败）
      - name: Fetch factory snapshot (assets/, not tracked)
        run: node scripts/refresh-factory-snapshot.cjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # TS 类型门禁（2026-10-12 P2）：strict 此前从未实际运行（tsdown 不做类型检查），
      # 覆盖 src/index.ts + tsdown.config.ts（src/client 为 JS 分块，不入 tsc 范围）
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Syntax check client bundle
        run: node --check lib/client.js

      - name: Unit tests (node:test)
        run: pnpm test

      # 客户端冒烟：模拟宿主环境调用 apply，断言对话节点/槽位注册齐全
      - name: Client apply smoke (simulate-client-apply)
        run: node scripts/simulate-client-apply.cjs

      # lib 漂移检查：push 阶段只警告（WIP 推送可能只改 src），发版时 release.yml 硬门禁阻断
      - name: Check lib/ drift (warn only)
        run: |
          git diff --exit-code -- lib/ || {
            echo "::warning::lib/ 与 src 构建输出不一致（WIP 可忽略）：发版前需本地 pnpm build 后提交 lib/，否则 tag 时会被 release 门禁阻断"
          }
